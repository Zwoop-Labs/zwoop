name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Build frontend
        run: cd web && npm ci && npm run build

      - name: Install Go dependencies
        run: go mod download

      - name: Build
        run: go build -v ./...

      - name: Format
        run: just fmt-check

      - name: Lint
        uses: golangci/golangci-lint-action@v9

      - name: Test
        run: just test-race

      - name: Vulnerability check
        run: just vuln

      - name: Web tests
        run: just web-test

      - name: Web audit (production deps)
        run: just web-audit
